name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must match gradle/gradle-daemon-jvm.properties (toolchainVersion=25); providing the JDK
      # here stops Gradle from having to auto-provision one on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # AGP 9 uses minor-versioned platform ids, so this is "android-37.0", not "android-37".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Builds the app and compiles+packages the instrumented suite, so the on-device tests are
      # kept honest even though they are executed on a local emulator (see README).
      - name: Assemble debug APK and instrumented test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
